name: Deploy Laravel App to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploying code to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            # Go to the application directory
            cd /www/wwwroot/khwenden.com/rebary_xwendn
            
            # Pull the latest changes from the main branch
            git pull origin main
            
            # Install dependencies
            composer install --no-interaction --prefer-dist --optimize-autoloader
            
            # Run database migrations
            php artisan migrate --force
            
            # Clear and cache routes, config, and views for better performance
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            # Restart queues if you have any
            # php artisan queue:restart
