<!-- EduBook - IQ mark — open book, no star badge.
     The star was removed to satisfy Google Play's Metadata policy, which bars
     icon imagery that reads as a rating/ranking indicator.
     Transparent background so it sits on the gold header.
     No SVG filters: flutter_svg does not render them reliably. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="160 239 704 576">
  <defs>
    <linearGradient id="pageL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAEFFA"/>
    </linearGradient>
    <linearGradient id="pageR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F6F8FE"/>
    </linearGradient>
  </defs>

  <!-- left page -->
  <path d="M512 330
           C 430 286, 320 268, 226 276
           C 206 278, 194 292, 194 311
           L 194 700
           C 194 719, 208 733, 227 732
           C 318 727, 428 744, 512 786 Z"
        fill="url(#pageL)"/>
  <!-- right page -->
  <path d="M512 330
           C 594 286, 704 268, 798 276
           C 818 278, 830 292, 830 311
           L 830 700
           C 830 719, 816 733, 797 732
           C 706 727, 596 744, 512 786 Z"
        fill="url(#pageR)"/>
  <!-- spine -->
  <path d="M512 348 L512 770" stroke="#C9D3E8" stroke-width="13" opacity="0.5"/>

  <!-- left page lines -->
  <g fill="#7C8CC4">
    <rect x="264" y="392" width="196" height="30" rx="15"/>
    <rect x="264" y="462" width="196" height="30" rx="15"/>
    <rect x="264" y="532" width="152" height="30" rx="15"/>
    <rect x="264" y="602" width="104" height="30" rx="15"/>
  </g>
  <!-- right page lines -->
  <g fill="#C79A2A">
    <rect x="564" y="392" width="196" height="30" rx="15"/>
    <rect x="564" y="462" width="196" height="30" rx="15"/>
    <rect x="564" y="532" width="152" height="30" rx="15"/>
    <rect x="564" y="602" width="104" height="30" rx="15"/>
  </g>
</svg>
